<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تجریش سمعک | آفلاین</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#fbf7ff,#fff);color:#4a126b;text-align:center;padding:20px}
    .box{max-width:460px;background:#fff;border-radius:28px;padding:28px;box-shadow:0 20px 60px rgba(74,18,107,.16);border:1px solid rgba(146,10,182,.12)}
    .ear{width:84px;height:84px;border-radius:28px;margin:0 auto 16px;background:linear-gradient(135deg,#920ab6,#e10b79);display:grid;place-items:center;color:#fff;font-size:42px}
    h1{font-size:20px;line-height:2;margin:0 0 8px}
    p{line-height:2;color:#74667d;margin:0}
    a{display:inline-flex;margin-top:18px;padding:10px 18px;border-radius:16px;background:linear-gradient(135deg,#920ab6,#e10b79);color:#fff;text-decoration:none;font-weight:900}
  </style>
</head>
<body>
  <main class="box">
    <div class="ear">⌕</div>
    <h1>اتصال اینترنت در دسترس نیست</h1>
    <p>بعضی بخش‌های کلینیک شنوایی و سمعک شکوه تجریش ذخیره شده‌اند. دوباره اتصال را بررسی کنید.</p>
    <a href="/">بازگشت به صفحه اصلی</a>
  </main>
</body>
</html>
